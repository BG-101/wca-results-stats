<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WCA Stats</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>WCA Stats</h1>
    <form id="search-form" autocomplete="off">
      <input id="wca-id" type="text" placeholder="WCA ID (p. ej. 2009ZEMD01)"
             maxlength="10" required pattern="[0-9]{4}[A-Za-z]{4}[0-9]{2}">
      <button type="submit">Analizar</button>
    </form>
  </header>

  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="summary" hidden></section>
    <section id="charts" hidden>
      <!-- Los gráficos se añadirán en fases siguientes -->
    </section>
  </main>

  <footer>
    Datos: WCA, vía la API no oficial wca-rest-api (se actualiza una vez al día).
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
